services:
  db:
    image: mysql:8.0
    container_name: bd_astronomia
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: Pollux5907
      MYSQL_DATABASE: turismo_astronomico
    ports:
      - "3306:3306"
    volumes:
      - "./basededatos proyecto.sql:/docker-entrypoint-initdb.d/init.sql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: app_astronomia
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: Pollux5907
      DB_NAME: turismo_astronomico
    depends_on:
      db:
        condition: service_healthy
